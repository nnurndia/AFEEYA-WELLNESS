<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>SUCCESS-ADD-PROGRESS | AFEEYA WELLNESS</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<style>
	    body {
			font-family: 'Poppins' , sans-serif;
			background: linear-gradient(135deg, #F8BBD0, #A7C7E7);
			margin: 0;
			padding: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh
		}
		
		.success-box {
			background: #FFF8F9;
			width: 450px;
			padding: 40px;
			text-align: center;
			border-radius: 18px;
			box-shadow: 0 5px 20px rgba(0,0,0.0.15);
			animation: fadeIn 0.9s ease;
		}
		
		h2 {
			color: #512DA8;
			font-size: 26px;
			margin-bottom: 15px;
		}
		
		p {
			color: #555;
			font-size: 16px;
			line-height: 1.5;
			margin-bottom: 25px;	
		}
		
		.btn {
			display: inline-block;
			background: linear-gradient(135deg, #A7C7E7, #7E57C2);
			padding: 12px 30px;
			border-radius: 30px;
			text-decoration: none;
			color: #fff;
			font-weight: 600;
			box-shadow: 0 4px 15px rgba(81,45,168,0.3);
			transition: 0.3s;
		}
		
		.btn:hover {
			transform: scale(1.05);
			background: linear-gradient(135deg, #F8BBD0, #512DA8);
		}
		
		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(20px); }
			to   { opacity: 1; transform: translateY(0); }
		}
	
	</style>
	
</head>

<body>
	
	<div class="success-box">
	   <h2>Progress Added Successfully!</h2>
	   <p>
		   Your workout has been recorded in the system<br>
		   Keep showing up for yourself, sis -<br>
		   every move brings you closer to your goals.
	   </p>
		
	   <a href="tracker.html" class="btn">Back to Workout Tracker</a>
	</div>
	
</body>
</html>
