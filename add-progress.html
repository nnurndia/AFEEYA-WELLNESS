<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ADD-PROGRESS | AFEEYA WELLNESS</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<style>
		body {
			font-family: 'Poppins', sans-serif;
			background: linear-gradient(135deg, #F8BBD0, #A7C7E7);
			margin: 0;
			padding: 0;
		}
		
		.container {
			width: 480px;
			background: #FFF8F9;
			margin: 50px auto;
			padding: 35px;
			border-radius: 15px;
			box-shadow: 0 4px 15px rgba(0,0,0,0.2);
			text-align: center;
		}
		
		label {
			font-size: 15px;
			font-weight: 600;
			display: block;
			margin-bottom: 8px;
			color: #512DA8;
			text-align: left;
		}
		
		input, select, textarea {
			width: 100%;
			padding: 14px;
			border-radius: 10px;
			border: 1px solid #bbb;
			margin-bottom: 18px;
			font-size: 15px;
			box-sizing: border-box;
		}
		
		textarea {
			height: 90px;
			resize: none;
		}
		
		.btn {
			width: 100%;
			background: linear-gradient(135deg, #512DA8, #7E57C2);
			padding: 12px;
			border: none;
			border-radius: 10px;
			color: white;
			font-size: 17px;
			font-weight: 600;
			cursor: pointer;
			transition: 0.3s;
		}
		
		.btn:hover {
			transform: scale(1.05);
			background: linear-gradient(135deg, #A7C7E7, #512DA8);
		}
	
	</style>
	
</head>

<body>
	
	<div class="container">
	     <h2 style="color:#512DA8;">Add Workout Progress</h2>
		
		<form action="progress-successful.html" method="post">
		
		    <label>Day</label>
			<select name="day" required>
			    <option value="">Select Day</option>
				<option>Monday</option>
				<option>Tuesday</option>
				<option>Wednesday</option>
				<option>Thursday</option>
				<option>Friday</option>
			</select>
			
			<label>Workout Type</label>
			<input type="text" name="workout" placeholder="e.g. Zumba, Yoga, Aerobic, Pilates" required>
			
			<label>Duration (minutes)</label>
			<input type="number" name="duration" required>
			
			<label>Calories Burned</label>
			<input type="number" name="calories" required>
			
			<label>Notes</label>
			<textarea name="notes" placeholder="Optional notes"></textarea>
			
			<button class="btn" type="submit">Save Progress</button>
			
		</form>
	
	</div>
	
</body>
</html>
