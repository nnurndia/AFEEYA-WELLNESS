<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>SUCCES-FORM | AFEEYA WELLNESS</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">  
	
	<style>
	    body {
	        font-family: 'Poppins', sans-serif;
			background: linear-gradient(135deg, #F8BBD0, #A7C7E7);
			margin: 0;
			padding: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
		}
		
		.success-box {
			background: #FFF8F9;
			width: 450px;
			padding: 40px;
			text-align: center;
			border-radius: 18px;
			box-shadow: 0 5px 20px rgba(0,0,0.0.15);
			animation: fadeIn 0.9s ease;
		}
		
		h2 {
			color: #512DA8;
			font-size: 26px;
			margin-bottom: 15px;
		}
		
		p {
			color: #555;
			font-size: 26px;
			margin-bottom: 15px;	
		}
		
		.btn-home {
			display: inline-block;
			background: linear-gradient(135deg, #A7C7E7, #7E57C2);
			padding: 12px 30px;
			border-radius: 30px;
			text-decoration: none;
			color: white;
			font-weight: 600;
			box-shadow: 0 4px 15px rgba(81,45,168,0.3);
			transition: 0.3s;
		}
		
		.btn-home:hover {
			transform: scale(1.05);
			background: linear-gradient(135deg, #F8BBD0, #512DA8);
		}
		
		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(20px); }
			to   { opacity: 1; transform: translateY(0); }
		}
	</style>
	
</head>

<body>
	
	<div class="success-box">
	   <h2> Registration Successful!</h2>
	   <p>
		   Thank you for choosing Afeeya Wellness<br>
		   Your membership package has been received.<br>
		   We can't wait to welcome you into our sisterhood!
	   </p>
		
	   <a href="index.html" class="btn-home">Back to Homepage</a>
	</div>
</body>
</html>
